name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Resolve product version
        shell: pwsh
        run: |
          $version = ./scripts/Get-ProductVersion.ps1 -IncludeSuffix
          "PRODUCT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore locked dependencies
        run: dotnet restore PCHelper.sln --locked-mode
      - name: Build
        run: dotnet build PCHelper.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PCHelper.sln --configuration Release --no-build --logger "trx;LogFilePrefix=pchelper"
      - name: Audit NuGet dependencies
        shell: pwsh
        # `dotnet package list --vulnerable` reports findings on stdout and still
        # exits 0, so running it alone audited nothing: a vulnerable transitive
        # package would have gone green. The report is what has to be inspected.
        run: |
          $report = dotnet package list --project PCHelper.sln --vulnerable --include-transitive 2>&1
          $report | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "The NuGet vulnerability audit did not run (exit $LASTEXITCODE)." }
          $findings = @($report | Where-Object { $_ -match 'has the following vulnerable packages' })
          if ($findings.Count -gt 0) {
            throw "Vulnerable NuGet packages were reported by $($findings.Count) project(s). Update or replace them before merging."
          }
          # Rejecting the failure phrase is only half the check: if the CLI ever
          # changes its wording, no line would match it and the audit would pass
          # silently having proven nothing. Requiring the clean marker as well
          # means an unrecognised report fails loudly instead of going green.
          $clean = @($report | Where-Object { $_ -match 'has no vulnerable packages' })
          if ($clean.Count -eq 0) {
            throw "The audit produced no recognisable per-project result, so nothing was actually verified. The 'dotnet package list' output format has probably changed; update this check rather than trusting a silent pass."
          }
      - name: Publish framework-dependent x64 payload
        shell: pwsh
        run: ./scripts/publish.ps1 -Version $env:PRODUCT_VERSION
      - name: Compile MSI authoring
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:PRODUCT_VERSION -SkipPublish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  report-api:
    name: Report API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: report-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
